[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whyenv"
dynamic = ["version"]
description = "Which source wins for an environment variable? Lists every place that can define it (.env files, shell, compose, framework rules), marks the winner and explains why your edit is ignored."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["env", "dotenv", "environment-variables", "vite", "next", "docker-compose", "debugging", "ai-agents", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://mrzroot.github.io/whyenv/"
Source = "https://github.com/mrzroot/whyenv"
Issues = "https://github.com/mrzroot/whyenv/issues"

[project.scripts]
whyenv = "whyenv.cli:main"

[tool.setuptools.dynamic]
version = { attr = "whyenv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
